name: FieldNode CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECRET_KEY: ci-only-secret
  FIELDNODE_API_KEY: ci-only-device-key
  FIELDNODE_METRICS_TOKEN: ci-only-metrics-token
  DEBUG: "True"
  DEMO_MODE: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest api_tcc/tests simulators

  backend-mysql:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "False"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: fieldnode_db
      DB_USER: root
      DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fieldnode_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest api_tcc/tests/test_telemetria.py api_tcc/tests/test_health.py api_tcc/tests/test_sync_contract.py

  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q api_tcc setup simulators scripts
      # Black/Flake8 are not project dependencies today; this job must not
      # pretend that a formatter exists. Adoption is tracked in the report.
      - run: python -m pytest --collect-only -q

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/generate_classification_fixtures.py --check
      - run: python scripts/generate_firmware_contract.py --check
      - run: python -m pytest api_tcc/tests/test_contract_parity.py api_tcc/tests/test_contract_generator.py api_tcc/tests/test_severity_contract.py simulators/test_edge_client.py

  firmware:
    uses: ./.github/workflows/firmware.yml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
      - run: npm audit --audit-level=high --prefix frontend-next
      - uses: gitleaks/gitleaks-action@v2

  migrations-check:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --plan
      - run: python manage.py migrate --noinput

  docs-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs_status.py

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    uses: ./.github/workflows/fieldnode-e2e.yml
