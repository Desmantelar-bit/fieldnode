services:
  db:
    image: mysql:8.0-debian
    platform: linux/amd64
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fieldnode_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-troque-esta-senha-local}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY:?configure SECRET_KEY no arquivo .env}
      FIELDNODE_API_KEY: ${FIELDNODE_API_KEY:?configure FIELDNODE_API_KEY no arquivo .env}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: ${USE_SQLITE:-False}
      DB_NAME: ${DB_NAME:-fieldnode_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-troque-esta-senha-local}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,web}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-bookworm
    platform: linux/amd64
    working_dir: /app
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000/api}
      NEXT_PUBLIC_FIELDNODE_API_KEY: ${NEXT_PUBLIC_FIELDNODE_API_KEY:?configure NEXT_PUBLIC_FIELDNODE_API_KEY no arquivo .env}
      FIELDNODE_SERVER_API_URL: ${FIELDNODE_SERVER_API_URL:-http://web:8000/api}
      NEXT_PUBLIC_FIELDNODE_SERVER_API_URL: ${NEXT_PUBLIC_FIELDNODE_SERVER_API_URL:-http://127.0.0.1:8000/api}
    volumes:
      - ./frontend-next:/app
    ports:
      - "3000:3000"
    entrypoint: >
      sh -c "if [ ! -d node_modules ] || [ ! -f node_modules/.bin/next ]; then
               npm install --legacy-peer-deps &&
               npm rebuild lightningcss;
             else
               npm rebuild lightningcss || true;
             fi &&
             rm -rf /app/.next || true &&
             npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - web

volumes:
  mysql_data:
