# Worker: limited to telemetry/status consumption and device ACK publication.
user fieldnode-worker
topic read fieldnode/+/telemetria
topic read fieldnode/+/status
topic write fieldnode/_ack/#
# ACL patterns also apply to named users; explicitly deny the worker's own
# device-shaped branches so only the worker-specific permissions take effect.
topic deny fieldnode/fieldnode-worker/#
topic deny fieldnode/_ack/fieldnode-worker

# Device username is exactly device_id. Each device may publish and subscribe
# only in its own hierarchy; devices never receive write access to ACK topics.
pattern write fieldnode/%u/telemetria
pattern write fieldnode/%u/status
pattern read fieldnode/_ack/%u
