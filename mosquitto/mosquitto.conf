# mosquitto.conf — FieldNode Docker
# O password file recebe hashes individuais pelos provisionadores do broker/dispositivo.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwordfile
acl_file /mosquitto/config/acl.conf

# Mantém persistência de sessão em volume
persistence true
persistence_location /mosquitto/data/

# Logs para stdout (visível em docker-compose logs)
log_dest stdout
log_type all
