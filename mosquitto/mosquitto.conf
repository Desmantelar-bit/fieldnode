# mosquitto.conf — FieldNode Docker
# Configuração mínima para o broker MQTT em desenvolvimento/demonstração.
# Sem autenticação: o projeto atualmente não exige credenciais MQTT.
# Escuta na porta 1883 em todas as interfaces da rede interna do Compose.

listener 1883
allow_anonymous true

# Mantém persistência de sessão em volume
persistence true
persistence_location /mosquitto/data/

# Logs para stdout (visível em docker-compose logs)
log_dest stdout
log_type all
