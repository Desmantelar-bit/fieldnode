# mosquitto.conf — FieldNode Docker
# O Compose gera o arquivo de senha no volume persistente antes de iniciar.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwordfile

# Mantém persistência de sessão em volume
persistence true
persistence_location /mosquitto/data/

# Logs para stdout (visível em docker-compose logs)
log_dest stdout
log_type all
